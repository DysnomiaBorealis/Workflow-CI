name: MLflow Training Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.12'
        miniconda-version: "latest"
    
    - name: Install Dependencies
      shell: bash -l {0}
      run: |
        pip install pandas==2.0.3 scikit-learn==1.7.2 matplotlib==3.7.2 seaborn==0.12.2 joblib==1.3.2
        pip install mlflow==3.8.0
    
    - name: Run MLflow Project
      shell: bash -l {0}
      run: |
        cd MLProject
        mlflow run . --no-conda -P test_size=0.2 -P random_state=42 -P alpha=0.1
    
    - name: Upload Model Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          MLProject/models/
          MLProject/artifacts/
          MLProject/mlruns/
    
    - name: Build Docker Image
      run: |
        cd MLProject
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }} .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:latest
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push Docker Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:latest
