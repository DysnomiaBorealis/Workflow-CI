name: MLflow Training Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v2
      with:
        auto-update-conda: true
        python-version: '3.12'
        miniconda-version: "latest"
    
    - name: Install MLflow
      shell: bash -l {0}
      run: |
        pip install mlflow==2.9.2
    
    - name: Run MLflow Project
      shell: bash -l {0}
      run: |
        cd MLProject
        mlflow run . --no-conda -P test_size=0.2 -P random_state=42 -P alpha=0.1
    
    - name: Upload Model Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          MLProject/models/
          MLProject/artifacts/
          MLProject/mlruns/
    
    - name: Build Docker Image
      run: |
        cd MLProject
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }} .
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }} ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:latest
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Push Docker Image to Docker Hub
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:${{ github.run_number }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/workflow-ci-spam-detection:latest
